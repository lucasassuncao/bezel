name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Repository hygiene, platform-independent and only worth doing once. The
  # git-diff comparisons would only produce line-ending noise on Windows.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # Keyed on scripts/make/tools.mk, where the tool versions are pinned, and on
      # go.mod, whose toolchain builds them: a stale build refuses a newer Go.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk', 'go.mod') }}

      - name: Check dependencies
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo ""
            echo "❌ go.mod or go.sum is out of date. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
          echo "✅ Dependencies are up to date."

      - name: Check formatting
        run: |
          make fmt
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Code is not formatted. Run 'make fmt' locally and commit the result."
            exit 1
          fi
          echo "✅ Code is properly formatted."

      - name: Check docs
        run: |
          make docs
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Documentation is out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi
          echo "✅ Documentation is up to date."

  # Consumers build TUIs for all three platforms, and the clipboard helpers and
  # terminal rendering are where they diverge. Lint and security run in the
  # matrix so no platform-sensitive analysis is judged by Linux alone.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk', 'go.mod') }}

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Test
        run: make test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn

  # The dependency graph comes from go.mod and is the same everywhere. Its own
  # job because it fails differently: a new CVE turns it red with no commit.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # syft and grype are slow to build for a scan that takes seconds.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk', 'go.mod') }}

      # Runs first so the reachability answer is in the log even when grype
      # fails the job on an advisory nothing here can execute.
      - name: Check reachable vulnerabilities
        run: make govulncheck

      - name: Scan dependencies
        run: make vuln

      # Uploaded even on failure: the SBOM is what you triage findings with.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  # Publishes the docs site that `make stage-docs` assembles, after the checks
  # confirm the docs are current, so Pages never ships pages they would catch.
  pages:
    name: Deploy GitHub Pages
    needs: checks
    # Never on a pull request: a deployment from an unmerged branch would
    # overwrite the live site with it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Job-level permissions replace the default for this job alone. contents:read
    # is what checkout needs; the rest is what the Pages deployment needs.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write

    # Two deployments must never overlap, and cancelling one mid-publish can
    # leave the site half-updated, so queue rather than cancel.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: make stage-docs

      # A rerun of this workflow would find the previous attempt's artifact
      # and refuse to upload another of the same name.
      - name: Delete stale artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' | \
          xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
